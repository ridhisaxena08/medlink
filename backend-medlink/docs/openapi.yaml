openapi: 3.0.3
info:
  title: MedLink360 API
  version: 1.0.0
  description: |
    Modular healthcare backend serving patients, doctors, ASHA workers,
    hospitals/admins and emergency responders from one database.

    **Access model.** Role alone never grants access to patient data. Every
    read or write that touches a patient goes through a central gate that
    requires one of: the patient themselves, an active consent record for the
    requested scope, a treatment relationship (doctor), an unexpired ASHA
    assignment *plus* matching consent, an operational hospital relationship,
    or a time-boxed emergency grant. Denials are audited.

    **Envelope.** Success: `{ "success": true, "data": ..., "meta"?: ... }`.
    Failure: `{ "success": false, "error": { "code", "message", "details"? }, "requestId" }`.
servers:
  - url: http://localhost:5000/api
    description: Local development
tags:
  - name: Auth
  - name: Users
  - name: Consent
  - name: Patient
  - name: Doctor
  - name: ASHA
  - name: Hospital
  - name: Admin
  - name: Responder
  - name: Appointments
  - name: Medical records
  - name: Files
  - name: Emergency
  - name: Intelligence
  - name: Notifications
  - name: Sync
  - name: Location
  - name: Audit

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    patientQuery:
      name: patient
      in: query
      description: Target patient id. Omitted means the caller themselves.
      schema: { $ref: '#/components/schemas/ObjectId' }
  schemas:
    ObjectId:
      type: string
      pattern: '^[0-9a-fA-F]{24}$'
      example: 507f1f77bcf86cd799439011
    Coordinates:
      type: array
      description: '[longitude, latitude]'
      minItems: 2
      maxItems: 2
      items: { type: number }
      example: [77.209, 28.6139]
    Role:
      type: string
      enum: [patient, doctor, asha, hospital, admin, responder]
    ConsentScope:
      type: string
      enum:
        [profile, medical_history, documents, medications, reminders,
         appointments, prescriptions, emergency, location, sms]
    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string, example: FORBIDDEN }
            message: { type: string }
            details: {}
        requestId: { type: string }
    Success:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: {}
        meta: { type: object }
    Tokens:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: string, example: 15m }
    RegisterRequest:
      type: object
      required: [name, phone, password, role]
      properties:
        name: { type: string, minLength: 2 }
        phone: { type: string, example: '+919876543210' }
        email: { type: string, format: email }
        password:
          type: string
          minLength: 8
          description: Must contain at least one letter and one digit.
        role: { $ref: '#/components/schemas/Role' }
        preferredLanguage: { type: string, enum: [en, hi], default: en }
        profile:
          type: object
          description: |
            Role-specific fields, validated per role. doctor: registrationNumber,
            specialties[]. asha: ashaId, district, state. hospital: name, type,
            registrationNumber, contact, address (with coordinates).
            responder: responderType. patient: optional demographics.
    LoginRequest:
      type: object
      required: [password]
      properties:
        phone: { type: string }
        email: { type: string, format: email }
        password: { type: string }
    ConsentRequest:
      type: object
      required: [grantee, granteeRole, scopes]
      properties:
        grantee: { $ref: '#/components/schemas/ObjectId' }
        granteeRole: { $ref: '#/components/schemas/Role' }
        scopes:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ConsentScope' }
        purpose: { type: string }
        durationDays: { type: integer, minimum: 1, maximum: 730 }
        patient:
          allOf: [{ $ref: '#/components/schemas/ObjectId' }]
          description: Assisted flows only; requires recorded (non in-app) evidence.
        evidence:
          type: object
          properties:
            method: { type: string, enum: [in_app, otp, verbal_recorded, paper] }
            reference: { type: string }
    AppointmentRequest:
      type: object
      required: [doctor, scheduledStart, reason]
      properties:
        doctor: { $ref: '#/components/schemas/ObjectId' }
        hospital: { $ref: '#/components/schemas/ObjectId' }
        department: { $ref: '#/components/schemas/ObjectId' }
        scheduledStart: { type: string, format: date-time }
        durationMinutes: { type: integer, minimum: 5, maximum: 180 }
        mode: { type: string, enum: [in_person, teleconsult], default: in_person }
        reason: { type: string }
        symptoms: { type: array, items: { type: string } }
        patient:
          allOf: [{ $ref: '#/components/schemas/ObjectId' }]
          description: Required when an ASHA worker or hospital books on behalf of a patient.
    SosRequest:
      type: object
      required: [location]
      properties:
        emergencyType:
          type: string
          enum: [medical, accident, cardiac, maternity, respiratory, trauma, other]
        severity: { type: string, enum: [low, medium, high, critical], default: high }
        description: { type: string }
        symptoms: { type: array, items: { type: string } }
        location: { $ref: '#/components/schemas/Coordinates' }
        pickupAddress: { type: string }
        landmark: { type: string }
        patient: { $ref: '#/components/schemas/ObjectId' }
        notifyRadiusKm: { type: number, default: 20 }
    SyncPushRequest:
      type: object
      required: [deviceId, records]
      properties:
        deviceId: { type: string }
        records:
          type: array
          maxItems: 200
          items:
            type: object
            required: [clientRecordId, entity, operation, payload, clientUpdatedAt]
            properties:
              clientRecordId: { type: string }
              entity:
                type: string
                enum: [medical_record, follow_up, reminder, appointment, emergency_request, document]
              operation: { type: string, enum: [create, update, delete] }
              payload: { type: object }
              clientUpdatedAt: { type: string, format: date-time }

  responses:
    Ok:
      description: Success
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Success' }
    Created:
      description: Created
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Success' }
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Access denied by role, consent, assignment or scope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflicting state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

paths:
  /auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Create an account (patients activate immediately; staff roles start pending verification)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Exchange credentials for a token pair
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Rotate a refresh token (reuse revokes every session)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties: { refreshToken: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current session, or all of them
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change the password and revoke every session
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /users/me:
    get:
      tags: [Users]
      summary: Account identity plus the role-specific profile
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    patch:
      tags: [Users]
      summary: Update account-level fields
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /users/me/deactivate:
    post:
      tags: [Users]
      summary: Deactivate the account and end all sessions
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /consents:
    post:
      tags: [Consent]
      summary: Grant scoped, expiring access over patient data
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentRequest' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      tags: [Consent]
      summary: List consents granted by or received by the caller
      parameters:
        - name: direction
          in: query
          schema: { type: string, enum: [granted, received], default: granted }
        - name: status
          in: query
          schema: { type: string, enum: [active, revoked, expired] }
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/limit' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /consents/{id}:
    delete:
      tags: [Consent]
      summary: Revoke a consent (patient or admin only)
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/ObjectId' } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /patients/me:
    get:
      tags: [Patient]
      summary: The signed-in patient's profile
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    put:
      tags: [Patient]
      summary: Update the patient profile
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /patients/dashboard:
    get:
      tags: [Patient]
      summary: Appointments, medications, reminders, documents, consents and open emergencies
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /patients/medical-history:
    get:
      tags: [Patient]
      summary: List medical history records
      parameters:
        - { $ref: '#/components/parameters/patientQuery' }
        - { name: type, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, resolved, inactive] } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Patient]
      summary: Add a condition, allergy, surgery, immunization or note
      responses:
        '201': { $ref: '#/components/responses/Created' }
  /patients/medicines:
    get:
      tags: [Patient]
      summary: The patient's medication list
      parameters:
        - { $ref: '#/components/parameters/patientQuery' }
        - { name: status, in: query, schema: { type: string, enum: [active, completed, stopped] } }
        - { name: confirmedOnly, in: query, schema: { type: boolean } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    post:
      tags: [Patient]
      summary: Add a medicine (entries added by others stay unconfirmed)
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /patients/medicines/{id}/confirm:
    patch:
      tags: [Patient]
      summary: Patient confirms a medicine, making it eligible for reminders
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/ObjectId' } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /patients/medicines/{id}/stop:
    patch:
      tags: [Patient]
      summary: Stop a medicine
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/ObjectId' } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /patients/{patientId}:
    get:
      tags: [Patient]
      summary: Another patient's profile (requires consent or an authorised relationship)
      parameters:
        - { name: patientId, in: path, required: true, schema: { $ref: '#/components/schemas/ObjectId' } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /patients/{patientId}/dashboard:
    get:
      tags: [Patient]
      summary: Authorised view of another patient's dashboard
      parameters:
        - { name: patientId, in: path, required: true, schema: { $ref: '#/components/schemas/ObjectId' } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /doctors:
    get:
      tags: [Doctor]
      summary: Discover verified doctors (text, specialty, location, fee, experience)
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: specialty, in: query, schema: { type: string } }
        - { name: language, in: query, schema: { type: string } }
        - { name: district, in: query, schema: { type: string } }
        - { name: mode, in: query, schema: { type: string, enum: [in_person, teleconsult] } }
        - { name: maxFee, in: query, schema: { type: number } }
        - { name: minExperience, in: query, schema: { type: integer } }
        - { name: lng, in: query, schema: { type: number } }
        - { name: lat, in: query, schema: { type: number } }
        - { name: radiusKm, in: query, schema: { type: number, default: 25 } }
        - { name: sort, in: query, schema: { type: string, enum: [experience, fee, rating, distance] } }
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/limit' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /doctors/me:
    get:
      tags: [Doctor]
      summary: The signed-in doctor's profile
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    put:
      tags: [Doctor]
      summary: Update the doctor profile
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /doctors/availability:
    get:
      tags: [Doctor]
      summary: Read the weekly availability template and exceptions
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    post:
      tags: [Doctor]
      summary: Replace the weekly availability template
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /doctors/dashboard:
    get:
      tags: [Doctor]
      summary: Today's schedule plus pending requests and weekly counts
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /doctors/appointments:
    get:
      tags: [Doctor]
      summary: The doctor's appointments
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /doctors/appointments/{id}/status:
    patch:
      tags: [Doctor]
      summary: Accept, reject, complete or mark no-show
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/ObjectId' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [confirmed, rejected, completed, no_show] }
                reason: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /doctors/patients/{patientId}:
    get:
      tags: [Doctor]
      summary: Consolidated clinical view of an authorised patient
      parameters:
        - { name: patientId, in: path, required: true, schema: { $ref: '#/components/schemas/ObjectId' } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /doctors/{doctorId}:
    get:
      tags: [Doctor]
      summary: Public profile of a verified doctor
      parameters:
        - { name: doctorId, in: path, required: true, schema: { $ref: '#/components/schemas/ObjectId' } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /doctors/{doctorId}/slots:
    get:
      tags: [Doctor]
      summary: Bookable slots for a given date
      parameters:
        - { name: doctorId, in: path, required: true, schema: { $ref: '#/components/schemas/ObjectId' } }
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
        - { name: mode, in: query, schema: { type: string, enum: [in_person, teleconsult] } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /consultations:
    post:
      tags: [Doctor]
      summary: Record a consultation (completes the linked appointment)
      responses:
        '201': { $ref: '#/components/responses/Created' }
  /consultations/{id}:
    get:
      tags: [Doctor]
      summary: Read a consultation note
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/ObjectId' } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /appointments:
    post:
      tags: [Appointments]
      summary: Book an appointment in a published slot
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppointmentRequest' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /appointments/my:
    get:
      tags: [Appointments]
      summary: Appointments for the caller, scoped by role
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: upcoming, in: query, schema: { type: boolean } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /appointments/{id}:
    get:
      tags: [Appointments]
      summary: Read one appointment
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/ObjectId' } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /appointments/{id}/cancel:
    patch:
      tags: [Appointments]
      summary: Cancel an appointment
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/ObjectId' } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /appointments/{id}/reschedule:
    patch:
      tags: [Appointments]
      summary: Move an appointment to another published slot
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/ObjectId' } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '409': { $ref: '#/components/responses/Conflict' }

  /medical-records:
    get:
      tags: [Medical records]
      summary: List medical records for an authorised patient
      parameters:
        - { $ref: '#/components/parameters/patientQuery' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    post:
      tags: [Medical records]
      summary: Create a medical record (source is derived from the author's role)
      responses:
        '201': { $ref: '#/components/responses/Created' }
  /medical-records/{id}:
    patch:
      tags: [Medical records]
      summary: Update a record (author or clinician)
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/ObjectId' } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    delete:
      tags: [Medical records]
      summary: Delete a record (patient or admin)
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/ObjectId' } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /files/upload:
    post:
      tags: [Files]
      summary: Upload a document (binary goes to object storage, metadata to MongoDB)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, title]
              properties:
                file: { type: string, format: binary }
                title: { type: string }
                category:
                  type: string
                  enum: [prescription, lab_report, scan, discharge_summary, insurance, id_proof, certificate, medicine_image, other]
                patient: { $ref: '#/components/schemas/ObjectId' }
                tags: { type: string, description: Comma-separated }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /files:
    post:
      tags: [Files]
      summary: Alias of POST /files/upload (multipart)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, title]
              properties:
                file: { type: string, format: binary }
                title: { type: string }
                category: { type: string }
                patient: { $ref: '#/components/schemas/ObjectId' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
    get:
      tags: [Files]
      summary: List documents for an authorised patient
      parameters:
        - { $ref: '#/components/parameters/patientQuery' }
        - { name: category, in: query, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /files/{id}:
    get:
      tags: [Files]
      summary: Download a document
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/ObjectId' } }
      responses:
        '200':
          description: The file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Files]
      summary: Archive a document
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/ObjectId' } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /files/{id}/meta:
    get:
      tags: [Files]
      summary: Document metadata without the bytes
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/ObjectId' } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /asha/me:
    get:
      tags: [ASHA]
      summary: The signed-in worker's profile
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    put:
      tags: [ASHA]
      summary: Update the worker profile
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /asha/dashboard:
    get:
      tags: [ASHA]
      summary: Caseload, consent gaps, due visits and expiring assignments
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /asha/patients:
    get:
      tags: [ASHA]
      summary: Assigned patients, each flagged with whether consent is actually active
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    post:
      tags: [ASHA]
