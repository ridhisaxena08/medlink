              type: object
              required: [name, phone, consent]
              properties:
                name: { type: string }
                phone: { type: string }
                preferredLanguage: { type: string, enum: [en, hi] }
                consent:
                  type: object
                  required: [scopes, evidence]
                  properties:
                    scopes: { type: array, items: { $ref: '#/components/schemas/ConsentScope' } }
                    durationDays: { type: integer }
                    evidence:
                      type: object
                      required: [method]
                      properties:
                        method: { type: string, enum: [otp, verbal_recorded, paper] }
                        reference: { type: string }
